version: '3.8'

services:
  # Backend - Django API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face-attendance-backend
    env_file:
      - ./backend/.env.production
    # No ports exposed publicly — nginx proxies internally
    expose:
      - "8000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - ml_models:/app/ml/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - face-attendance-network

  # Frontend - React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: face-attendance-frontend
    # No ports exposed publicly — nginx proxies internally
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - face-attendance-network
    depends_on:
      - backend

  # MongoDB (Optional - if not using MongoDB Atlas)
  # Uncomment if you want to run MongoDB locally
  # mongodb:
  #   image: mongo:7.0
  #   container_name: face-attendance-mongodb
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: changeme
  #     MONGO_INITDB_DATABASE: face_attendance
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   restart: unless-stopped
  #   networks:
  #     - face-attendance-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: face-attendance-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    restart: unless-stopped
    networks:
      - face-attendance-network
    depends_on:
      - backend
      - frontend

volumes:
  backend_media:
    driver: local
  backend_static:
    driver: local
  ml_models:
    driver: local
  # mongodb_data:
  #   driver: local

networks:
  face-attendance-network:
    driver: bridge
